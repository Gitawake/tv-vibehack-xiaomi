plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 35

    defaultConfig {
        applicationId 'com.gathin.tvhome'
        minSdk 26
        targetSdk 34
        versionCode 11
        versionName '2.4-xiaomi.4'
    }

    signingConfigs {
        release {
            if (System.getenv('TV_RELEASE_STORE_FILE')) {
                storeFile file(System.getenv('TV_RELEASE_STORE_FILE'))
                storePassword System.getenv('TV_RELEASE_STORE_PASSWORD')
                keyAlias System.getenv('TV_RELEASE_KEY_ALIAS')
                keyPassword System.getenv('TV_RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Public releases use the repository's fixed private key; local builds remain debuggably signed.
            signingConfig System.getenv('TV_RELEASE_STORE_FILE') ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}
